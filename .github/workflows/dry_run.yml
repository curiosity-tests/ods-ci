name: dryrun
run-name: "dryrun ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  pull_request:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  dryrun:
    runs-on: ubuntu-latest

    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'poetry'

      - name: Execute ods-ci dryrun
        run: |
          cd ods_ci
          mv test-variables.yml.example test-variables.yml
          ./run_robot_test.sh --extra-robot-args '--dryrun' --skip-oclogin true --no-output-subfolder true

      - name: Save PR number and artifacts
        run: |
          mkdir -p ./pr
          cp -r ods_ci/test-output ./pr/test-output
          echo ${{ github.event.number }} > ./pr/NR
      - uses: actions/upload-artifact@v4
        with:
          name: pr
          path: pr/
